name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 진행 중인 것을 끝까지 마친다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 타입 검사 → 단위 테스트(각주·데이터 검사 포함) → vite build → 라우트별 HTML·404.html·sitemap.xml 생성까지 포함
      - run: npm run build

      - uses: actions/configure-pages@v6

      # v4부터 점(.)으로 시작하는 파일은 올리지 않는다. dist에는 그런 파일이 없다(.vite 매니페스트는 빌드 끝에 지운다).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
